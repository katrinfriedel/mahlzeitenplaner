<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katrin & Greg · Mahlzeitenplaner</title>
<style>
  :root {
    --teal: #2D9B8E;
    --teal-dark: #217A70;
    --teal-light: #E8F5F3;
    --cream: #FDF8F2;
    --warm: #F5E6D3;
    --text: #2C3830;
    --text-light: #6B7D76;
    --border: #D8E8E5;
    --white: #FFFFFF;
    --red: #E05A4A;
    --red-light: #FDF0EE;
    --shadow: 0 2px 12px rgba(45,155,142,0.10);
    --shadow-lg: 0 8px 32px rgba(45,155,142,0.15);
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }

  /* ── PASSWORD ── */
  #pw-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; background: linear-gradient(135deg, var(--teal) 0%, #1a6b60 100%);
  }
  .pw-card {
    background: var(--white); border-radius: 20px; padding: 48px 40px;
    box-shadow: var(--shadow-lg); text-align: center; width: 360px; max-width: 90vw;
  }
  .pw-emoji { font-size: 48px; margin-bottom: 16px; }
  .pw-title { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .pw-sub { color: var(--text-light); font-size: 14px; margin-bottom: 32px; }
  .pw-card input[type=password] {
    width: 100%; padding: 14px 18px; border: 2px solid var(--border);
    border-radius: var(--radius-sm); font-size: 18px; letter-spacing: 4px;
    text-align: center; outline: none; transition: border-color .2s;
    margin-bottom: 16px;
  }
  .pw-card input[type=password]:focus { border-color: var(--teal); }
  .pw-card input[type=password].shake { animation: shake .35s; border-color: var(--red); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 60%{transform:translateX(8px)} 80%{transform:translateX(-4px)} }
  .pw-error { color: var(--red); font-size: 13px; margin-bottom: 12px; min-height: 18px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 12px 24px; border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s; }
  .btn-primary { background: var(--teal); color: var(--white); width: 100%; justify-content: center; }
  .btn-primary:hover { background: var(--teal-dark); }
  .btn-ghost { background: transparent; color: var(--teal); border: 2px solid var(--teal); }
  .btn-ghost:hover { background: var(--teal-light); }
  .btn-danger { background: var(--red-light); color: var(--red); }
  .btn-danger:hover { background: #fbe0dd; }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .btn-icon { padding: 8px; border-radius: 8px; background: transparent; border: 1px solid var(--border); color: var(--text-light); cursor: pointer; font-size: 16px; transition: all .15s; }
  .btn-icon:hover { background: var(--teal-light); color: var(--teal); border-color: var(--teal); }

  /* ── APP SHELL ── */
  #app { display: none; min-height: 100vh; }

  /* ── HEADER ── */
  header {
    background: var(--white); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .header-inner {
    max-width: 960px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 60px;
  }
  .header-brand { font-size: 17px; font-weight: 700; color: var(--teal); letter-spacing: -0.3px; }
  nav { display: flex; gap: 4px; }
  .nav-btn {
    padding: 8px 16px; border: none; background: transparent;
    border-radius: var(--radius-sm); font-size: 14px; font-weight: 500;
    color: var(--text-light); cursor: pointer; transition: all .15s;
  }
  .nav-btn.active { background: var(--teal-light); color: var(--teal); font-weight: 600; }
  .nav-btn:hover:not(.active) { background: var(--warm); color: var(--text); }
  .logout-btn { font-size: 13px; color: var(--text-light); background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 6px; }
  .logout-btn:hover { color: var(--text); background: var(--warm); }

  /* ── VIEWS ── */
  .view { display: none; max-width: 960px; margin: 0 auto; padding: 28px 20px 60px; }
  .view.active { display: block; }

  /* ── PLAN VIEW ── */
  .plan-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
  }
  .plan-title { font-size: 22px; font-weight: 700; }
  .plan-range { color: var(--text-light); font-size: 14px; margin-top: 2px; }
  .plan-nav { display: flex; gap: 8px; align-items: center; }
  .plan-grid {
    display: grid; grid-template-columns: 100px repeat(3, 1fr);
    gap: 8px;
  }
  .plan-grid-header {
    background: var(--teal); color: var(--white); border-radius: var(--radius-sm);
    padding: 10px 12px; text-align: center; font-weight: 600; font-size: 13px;
  }
  .plan-grid-header .day-name { font-size: 15px; font-weight: 700; }
  .plan-grid-header .day-date { font-size: 11px; opacity: .8; margin-top: 2px; }
  .plan-row-label {
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 12px; font-size: 13px; font-weight: 600; color: var(--text-light);
  }
  .meal-cell {
    background: var(--white); border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    padding: 10px; min-height: 70px; cursor: pointer; transition: all .15s;
    display: flex; flex-direction: column; gap: 4px;
  }
  .meal-cell:hover { border-color: var(--teal); box-shadow: var(--shadow); }
  .meal-cell.filled { border-color: var(--teal); background: var(--teal-light); }
  .meal-cell-name { font-size: 13px; font-weight: 600; color: var(--teal-dark); line-height: 1.3; }
  .meal-cell-hint { font-size: 11px; color: var(--text-light); }
  .meal-cell-empty { font-size: 12px; color: var(--text-light); display: flex; align-items: center; gap: 4px; }
  .meal-cell-empty::before { content: '+'; font-size: 16px; color: var(--teal); font-weight: 300; }

  @media (max-width: 600px) {
    .plan-grid { grid-template-columns: 72px repeat(3, 1fr); gap: 5px; }
    .plan-row-label { font-size: 11px; padding-right: 6px; }
    .plan-grid-header { padding: 8px 6px; font-size: 11px; }
    .plan-grid-header .day-name { font-size: 13px; }
    .meal-cell { padding: 7px; min-height: 58px; }
    .meal-cell-name { font-size: 11px; }
  }

  /* ── RECIPES VIEW ── */
  .recipes-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .recipes-title { font-size: 22px; font-weight: 700; }
  .filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .filter-tab {
    padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500;
    border: 1.5px solid var(--border); background: var(--white); color: var(--text-light);
    cursor: pointer; transition: all .15s;
  }
  .filter-tab.active { background: var(--teal); color: var(--white); border-color: var(--teal); }
  .filter-tab:hover:not(.active) { border-color: var(--teal); color: var(--teal); }
  .recipe-list { display: grid; gap: 10px; }
  .recipe-card {
    background: var(--white); border-radius: var(--radius); border: 1px solid var(--border);
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .recipe-card-info { flex: 1; }
  .recipe-card-name { font-size: 15px; font-weight: 600; margin-bottom: 3px; }
  .recipe-card-meta { font-size: 12px; color: var(--text-light); display: flex; gap: 10px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge-frueh { background: #FFF3E0; color: #E65100; }
  .badge-lunch { background: #E3F2FD; color: #1565C0; }
  .badge-abend { background: #F3E5F5; color: #6A1B9A; }
  .recipe-card-actions { display: flex; gap: 6px; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-light); }
  .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state-text { font-size: 15px; }

  /* ── SHOPPING VIEW ── */
  .shopping-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 12px; }
  .shopping-title { font-size: 22px; font-weight: 700; }
  .shopping-range { color: var(--text-light); font-size: 13px; margin-bottom: 20px; }
  .shopping-group { margin-bottom: 24px; }
  .shopping-group-title {
    font-size: 13px; font-weight: 700; color: var(--text-light); letter-spacing: .5px;
    text-transform: uppercase; margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .shopping-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: var(--radius-sm);
    cursor: pointer; transition: background .1s;
  }
  .shopping-item:hover { background: var(--warm); }
  .shopping-item.checked { opacity: .45; }
  .shopping-item.checked .shopping-item-name { text-decoration: line-through; }
  .shopping-cb { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .shopping-item.checked .shopping-cb { background: var(--teal); border-color: var(--teal); }
  .shopping-cb-check { color: white; font-size: 11px; display: none; }
  .shopping-item.checked .shopping-cb-check { display: block; }
  .shopping-item-name { font-size: 14px; flex: 1; }
  .shopping-item-amount { font-size: 13px; color: var(--text-light); }
  .whatsapp-btn {
    display: flex; align-items: center; gap: 8px;
    background: #25D366; color: white; border: none; border-radius: var(--radius-sm);
    padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .whatsapp-btn:hover { background: #1eb858; }
  .shopping-empty { text-align: center; padding: 40px 20px; color: var(--text-light); font-size: 14px; }
  .shopping-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

  /* ── MODALS ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.45); z-index: 200;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white); border-radius: 16px;
    width: 100%; max-width: 560px; max-height: 90vh;
    overflow-y: auto; box-shadow: var(--shadow-lg);
  }
  .modal-header {
    padding: 20px 24px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--white); z-index: 1;
  }
  .modal-title { font-size: 18px; font-weight: 700; }
  .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-light); padding: 2px 6px; border-radius: 6px; }
  .modal-close:hover { background: var(--warm); color: var(--text); }
  .modal-body { padding: 20px 24px; }
  .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

  /* ── FORM ELEMENTS ── */
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .4px; }
  .form-input, .form-select {
    width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
    border-radius: var(--radius-sm); font-size: 15px; outline: none;
    transition: border-color .15s; background: var(--white);
  }
  .form-input:focus, .form-select:focus { border-color: var(--teal); }
  .category-radio { display: flex; gap: 8px; flex-wrap: wrap; }
  .cat-option input { display: none; }
  .cat-option label {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--border);
    font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s;
    color: var(--text-light);
  }
  .cat-option input:checked + label { background: var(--teal); color: var(--white); border-color: var(--teal); }

  /* ── INGREDIENTS TABLE ── */
  .ingredients-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .ingredient-row { display: grid; grid-template-columns: 1fr 80px 90px 32px; gap: 6px; align-items: center; }
  .ingredient-row .form-input { padding: 8px 10px; font-size: 13px; }
  .ingredient-del { background: none; border: none; color: var(--red); font-size: 18px; cursor: pointer; padding: 4px; border-radius: 4px; line-height: 1; }
  .ingredient-del:hover { background: var(--red-light); }
  .ingredient-header { display: grid; grid-template-columns: 1fr 80px 90px 32px; gap: 6px; }
  .ingredient-header span { font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: .4px; }

  /* ── MEAL PICKER MODAL ── */
  .meal-search { margin-bottom: 14px; }
  .recipe-option {
    padding: 12px 14px; border-radius: var(--radius-sm); cursor: pointer;
    display: flex; align-items: center; gap: 10px; transition: background .1s;
    border: 1.5px solid transparent;
  }
  .recipe-option:hover { background: var(--teal-light); border-color: var(--teal); }
  .recipe-option-name { font-size: 14px; font-weight: 600; }
  .recipe-option-ing { font-size: 12px; color: var(--text-light); }
  .recipe-option-clear {
    padding: 10px 14px; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--red); font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  }
  .recipe-option-clear:hover { background: var(--red-light); }
  .meal-type-label { font-size: 12px; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--white); padding: 10px 20px; border-radius: 20px;
    font-size: 13px; font-weight: 500; z-index: 999; opacity: 0; transition: all .25s;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="pw-screen">
  <div class="pw-card">
    <div class="pw-emoji">🥗</div>
    <div class="pw-title">Katrin & Greg</div>
    <div class="pw-sub">Euer persönlicher Mahlzeitenplaner</div>
    <input type="password" id="pw-input" placeholder="Passwort" autocomplete="off">
    <div class="pw-error" id="pw-error"></div>
    <button class="btn btn-primary" onclick="checkPassword()">Anmelden</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-inner">
      <div class="header-brand">🥗 Katrin & Greg</div>
      <nav>
        <button class="nav-btn active" onclick="showView('plan')">📅 Plan</button>
        <button class="nav-btn" onclick="showView('recipes')">🍽 Rezepte</button>
        <button class="nav-btn" onclick="showView('shopping')">🛒 Einkauf</button>
      </nav>
      <button class="logout-btn" onclick="logout()">Abmelden</button>
    </div>
  </header>

  <!-- PLAN VIEW -->
  <div id="view-plan" class="view active">
    <div class="plan-header">
      <div>
        <div class="plan-title">Mahlzeitenplan</div>
        <div class="plan-range" id="plan-range-label"></div>
      </div>
      <div class="plan-nav">
        <button class="btn btn-ghost btn-sm" onclick="navigatePlan(-1)">← Zurück</button>
        <button class="btn btn-ghost btn-sm" onclick="goToToday()">Heute</button>
        <button class="btn btn-ghost btn-sm" onclick="navigatePlan(1)">Weiter →</button>
      </div>
    </div>
    <div class="plan-grid" id="plan-grid"></div>
  </div>

  <!-- RECIPES VIEW -->
  <div id="view-recipes" class="view">
    <div class="recipes-header">
      <div class="recipes-title">Rezepte</div>
      <button class="btn btn-primary btn-sm" onclick="openRecipeForm(null)">+ Neues Rezept</button>
    </div>
    <div class="filter-tabs" id="filter-tabs">
      <div class="filter-tab active" onclick="setFilter('Alle')">Alle</div>
      <div class="filter-tab" onclick="setFilter('Frühstück')">🌅 Frühstück</div>
      <div class="filter-tab" onclick="setFilter('Lunch')">☀️ Lunch</div>
      <div class="filter-tab" onclick="setFilter('Abendessen')">🌙 Abendessen</div>
    </div>
    <div class="recipe-list" id="recipe-list"></div>
  </div>

  <!-- SHOPPING VIEW -->
  <div id="view-shopping" class="view">
    <div class="shopping-header">
      <div class="shopping-title">Einkaufsliste</div>
    </div>
    <div class="shopping-range" id="shopping-range-label"></div>
    <div class="shopping-actions">
      <button class="whatsapp-btn" onclick="shareWhatsApp()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Per WhatsApp teilen
      </button>
      <button class="btn btn-ghost btn-sm" onclick="resetChecked()">Liste zurücksetzen</button>
    </div>
    <div id="shopping-content"></div>
  </div>
</div>

<!-- MODAL: Rezept bearbeiten/erstellen -->
<div class="modal-overlay" id="recipe-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="recipe-modal-title">Rezept hinzufügen</div>
      <button class="modal-close" onclick="closeRecipeModal()">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="recipe-id">
      <div class="form-group">
        <label class="form-label">Name des Gerichts</label>
        <input type="text" class="form-input" id="recipe-name" placeholder="z.B. Pasta Pomodoro">
      </div>
      <div class="form-group">
        <label class="form-label">Mahlzeit</label>
        <div class="category-radio">
          <div class="cat-option"><input type="radio" name="category" id="cat-fr" value="Frühstück"><label for="cat-fr">🌅 Frühstück</label></div>
          <div class="cat-option"><input type="radio" name="category" id="cat-lu" value="Lunch"><label for="cat-lu">☀️ Lunch</label></div>
          <div class="cat-option"><input type="radio" name="category" id="cat-ab" value="Abendessen"><label for="cat-ab">🌙 Abendessen</label></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Zutaten (für 2 Personen)</label>
        <div class="ingredient-header">
          <span>Zutat</span><span>Menge</span><span>Einheit</span><span></span>
        </div>
        <div class="ingredients-list" id="ingredients-list"></div>
        <button class="btn btn-ghost btn-sm" onclick="addIngredientRow()" style="margin-top:6px">+ Zutat hinzufügen</button>
      </div>
      <div class="form-group">
        <label class="form-label">Notizen (optional)</label>
        <input type="text" class="form-input" id="recipe-notes" placeholder="z.B. glutenfrei, Lieblingsrezept...">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeRecipeModal()">Abbrechen</button>
      <button class="btn btn-primary" onclick="saveRecipe()">Speichern</button>
    </div>
  </div>
</div>

<!-- MODAL: Mahlzeit auswählen -->
<div class="modal-overlay" id="meal-modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="meal-modal-title">Mahlzeit wählen</div>
        <div class="meal-type-label" id="meal-modal-sub"></div>
      </div>
      <button class="modal-close" onclick="closeMealModal()">×</button>
    </div>

// ── INGREDIENT CATEGORIES ────────────────────────────────────────────────────
const CATEGORIES_KEYWORDS = {
  'Gemüse': ['zucchini','paprika','aubergine','tomate','tomaten','kirschtomaten','karotte','karotten','sellerie','pak choi','frühlingszwiebel','frühlingszwiebeln','zwiebel','zwiebeln','knoblauch','ingwer','gurke','rucola','sojasprossen','erbsen','edamame','minze','basilikum','salbei','schnittlauch','thymian','wakame'],
  'Obst': ['banane','mango','beeren','apfel','kiwi','limette','zitrone','heidelbeeren','erdbeeren'],
  'Milchprodukte & Eier': ['joghurt','skyr','parmesan','mozzarella','schafskäse','feta','sahne','butter','eier','ei','pecorino','milch','béchamel'],
  'Getreide, Brot & Nudeln': ['pasta','spaghetti','reis','risottoreis','mehl','brot','brötchen','müslibrötchen','haferflocken','granola','müsli','gnocchi','lasagneplatten','wraps','fladenbrot','ciabatta','ramen','reisnudeln','pizzateig','nudeln'],
  'Hülsenfrüchte & Tofu': ['linsen','bohnen','tofu','edamame'],
  'Gewürze, Öle & Soßen': ['olivenöl','sesamöl','sojasoße','pesto','miso','balsamico','curry','chiliflocken','pfeffer','zimt','kräuter','honig','ahornsirup','pad-thai','tomatensoße','gemüsebrühe','kokosmilch','weißwein','nori'],
  'Nüsse & Samen': ['nüsse','mandeln','erdnüsse','sesam'],
  'Sonstiges': []
};

function categorizeIngredient(name) {
  const n = name.toLowerCase();
  for (const [cat, keywords] of Object.entries(CATEGORIES_KEYWORDS)) {
    if (cat === 'Sonstiges') continue;
    if (keywords.some(k => {
      const idx = n.indexOf(k);
      if (idx === -1) return false;
      const before = idx === 0 || /[\s,()/-]/.test(n[idx - 1]);
      const after = idx + k.length >= n.length || /[\s,()/-]/.test(n[idx + k.length]);
      return before && after;
    })) return cat;
  }
  return 'Sonstiges';
}

// ── DATE UTILS ────────────────────────────────────────────────────────────────
function toDateKey(date) {
  return date.toISOString().split('T')[0];
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function getStartOfThreeDayWindow(date) {
  const epoch = new Date(Date.UTC(2026, 0, 1));
  const diff = Math.floor((date - epoch) / (1000 * 60 * 60 * 24));
  const windowIndex = Math.floor(diff / 3);
  const d = new Date(epoch);
  d.setDate(d.getDate() + windowIndex * 3);
  return d;
}
const DE_DAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const DE_MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const DE_MONTHS_FULL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function formatDateShort(d) { return `${d.getDate()}. ${DE_MONTHS[d.getMonth()]}`; }
function formatDateFull(d) { return `${d.getDate()}. ${DE_MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`; }
function formatDayName(d) { return DE_DAYS[d.getDay()]; }

// ── PLAN RENDER ───────────────────────────────────────────────────────────────
function renderPlan() {
  const days = [planStart, addDays(planStart,1), addDays(planStart,2)];
  const d0 = formatDateShort(days[0]);
  const d2 = formatDateShort(days[2]);
  document.getElementById('plan-range-label').textContent = `${d0} – ${d2}`;
  document.getElementById('shopping-range-label').textContent = `Zutaten für ${d0} – ${d2}`;

  const grid = document.getElementById('plan-grid');
  const meals = ['Frühstück','Lunch','Abendessen'];
  const mealKeys = ['breakfast','lunch','dinner'];
  const mealEmoji = ['🌅','☀️','🌙'];

  let html = '<div></div>'; // corner
  days.forEach(d => {
    html += `<div class="plan-grid-header"><div class="day-name">${formatDayName(d)}</div><div class="day-date">${formatDateShort(d)}</div></div>`;
  });

  meals.forEach((meal, mi) => {
    html += `<div class="plan-row-label">${mealEmoji[mi]} ${meal}</div>`;
    days.forEach(d => {
      const key = toDateKey(d);
      const recipeId = mealPlan[key]?.[mealKeys[mi]];
      const recipe = recipeId ? recipes.find(r => r.id === recipeId) : null;
      if (recipe) {
        html += `<div class="meal-cell filled" onclick="openMealModal('${key}','${mealKeys[mi]}')">
          <div class="meal-cell-name">${recipe.name}</div>
          <div class="meal-cell-hint">${recipe.ingredients.length} Zutaten</div>
        </div>`;
      } else {
        html += `<div class="meal-cell" onclick="openMealModal('${key}','${mealKeys[mi]}')">
          <div class="meal-cell-empty">Mahlzeit wählen</div>
        </div>`;
      }
    });
  });

  grid.innerHTML = html;
}

  });

  ings.forEach(ing => addIngredientRow(ing));

function closeRecipeModal() {
  document.getElementById('recipe-modal').classList.remove('open');

}

function addIngredientRow(ing = {name:'',amount:'',unit:''}) {
  const list = document.getElementById('ingredients-list');
  const row = document.createElement('div');
  row.className = 'ingredient-row';
  row.innerHTML = `
    <input type="text" class="form-input ing-name" placeholder="z.B. Pasta" value="${ing.name||''}">
    <input type="text" class="form-input ing-amount" placeholder="200" value="${ing.amount||''}">
    <input type="text" class="form-input ing-unit" placeholder="g / Stück" value="${ing.unit||''}">
    <button class="ingredient-del" onclick="this.parentElement.remove()">×</button>
  `;
  list.appendChild(row);
}

function saveRecipe() {
  const name = document.getElementById('recipe-name').value.trim();
  if (!name) { showToast('Bitte einen Namen eingeben'); return; }
  const category = document.querySelector('input[name=category]:checked')?.value;
  if (!category) { showToast('Bitte eine Kategorie wählen'); return; }
  const notes = document.getElementById('recipe-notes').value.trim();
  const ingredients = [];
  document.querySelectorAll('.ingredient-row').forEach(row => {
    const n = row.querySelector('.ing-name').value.trim();
    const a = row.querySelector('.ing-amount').value.trim();
    const u = row.querySelector('.ing-unit').value.trim();
    if (n) ingredients.push({ name: n, amount: a, unit: u });
  });

  const id = editingRecipeId || ('r' + Date.now());
  const recipe = { id, name, category, notes, ingredients };

  if (editingRecipeId) {
    recipes = recipes.map(r => r.id === editingRecipeId ? recipe : r);
  } else {
    recipes = [...recipes, recipe];
  }
  DB.saveRecipes(recipes);
  closeRecipeModal();
  renderRecipes();
  renderPlan();
  showToast(editingRecipeId ? 'Rezept aktualisiert ✓' : 'Rezept gespeichert ✓');
}

function deleteRecipe(id) {
  if (!confirm('Dieses Rezept wirklich löschen?')) return;
  recipes = recipes.filter(r => r.id !== id);
  // also remove from meal plan
  Object.keys(mealPlan).forEach(k => {
    ['breakfast','lunch','dinner'].forEach(m => {
      if (mealPlan[k]?.[m] === id) mealPlan[k][m] = null;
    });
  });
  DB.saveRecipes(recipes);
  DB.saveMealPlan(mealPlan);
  renderRecipes();
  renderPlan();
  showToast('Rezept gelöscht');
}

function renderMealOptions() {
  const q = document.getElementById('meal-search').value.trim().toLowerCase();
  const cat = mealCatMap[mealModalCtx?.mealKey];

function selectMeal(recipeId) {

function clearMeal() {

  closeMealModal();
  renderPlan();
  renderShopping();
  showToast('Mahlzeit entfernt');
}

// ── SHOPPING LIST ─────────────────────────────────────────────────────────────
function getShoppingIngredients() {
  const days = [planStart, addDays(planStart,1), addDays(planStart,2)];
  const aggregated = {}; // key: "name|unit" → {name, unit, amounts:[]}

  days.forEach(d => {
    const key = toDateKey(d);
    const dayPlan = mealPlan[key] || {};
    ['breakfast','lunch','dinner'].forEach(m => {
      const rid = dayPlan[m];
      if (!rid) return;
      const recipe = recipes.find(r => r.id === rid);
      if (!recipe) return;
      recipe.ingredients.forEach(ing => {
        const k = ing.name.toLowerCase() + '|' + (ing.unit||'').toLowerCase();
        if (!aggregated[k]) aggregated[k] = { name: ing.name, unit: ing.unit, amounts: [] };
        if (ing.amount) aggregated[k].amounts.push(ing.amount);
      });
    });
  });

  return Object.values(aggregated).map(item => {
    const nums = item.amounts.map(a => parseFloat(a.replace(',','.'))).filter(n => !isNaN(n));
    const total = nums.length ? nums.reduce((a,b)=>a+b,0) : null;
    const amountStr = total !== null
      ? (Number.isInteger(total) ? total : Math.round(total*10)/10) + (item.unit ? ' ' + item.unit : '')
      : (item.amounts.join('+') + (item.unit ? ' ' + item.unit : ''));
    return { name: item.name, amount: amountStr, category: categorizeIngredient(item.name) };
  });
}

function renderShopping() {
  const items = getShoppingIngredients();
  const content = document.getElementById('shopping-content');

  if (!items.length) {
    content.innerHTML = `<div class="shopping-empty">Noch keine Mahlzeiten im Plan.<br>Fülle den 3-Tage-Plan aus, dann erscheint hier deine Einkaufsliste. 🛒</div>`;
    return;
  }

  const grouped = {};
  items.forEach(item => {
    if (!grouped[item.category]) grouped[item.category] = [];
    grouped[item.category].push(item);
  });

  const catOrder = ['Gemüse','Obst','Milchprodukte & Eier','Getreide, Brot & Nudeln','Hülsenfrüchte & Tofu','Nüsse & Samen','Gewürze, Öle & Soßen','Sonstiges'];
  let html = '';
  catOrder.forEach(cat => {
    if (!grouped[cat]?.length) return;
    html += `<div class="shopping-group"><div class="shopping-group-title">${cat}</div>`;
    grouped[cat].forEach((item, i) => {
      const ckKey = cat + '|' + item.name;
      const isChecked = checkedItems.includes(ckKey);
      html += `<div class="shopping-item${isChecked?' checked':''}" onclick="toggleCheck('${ckKey}')">
        <div class="shopping-cb"><span class="shopping-cb-check">✓</span></div>
        <div class="shopping-item-name">${item.name}</div>
        <div class="shopping-item-amount">${item.amount}</div>
      </div>`;
    });
    html += '</div>';
  });
  content.innerHTML = html;
}

function toggleCheck(key) {
  if (checkedItems.includes(key)) {
    checkedItems = checkedItems.filter(k => k !== key);
  } else {
    checkedItems = [...checkedItems, key];
  }
  DB.saveChecked(checkedItems);
  renderShopping();
}

function resetChecked() {
  checkedItems = [];
  DB.saveChecked([]);
  renderShopping();
  showToast('Liste zurückgesetzt');
}

function shareWhatsApp() {
  const items = getShoppingIngredients();
  if (!items.length) { showToast('Keine Einträge in der Einkaufsliste'); return; }

  const d0 = formatDateShort(planStart);
  const d2 = formatDateShort(addDays(planStart, 2));
  const catOrder = ['Gemüse','Obst','Milchprodukte & Eier','Getreide, Brot & Nudeln','Hülsenfrüchte & Tofu','Nüsse & Samen','Gewürze, Öle & Soßen','Sonstiges'];

  const grouped = {};
  items.forEach(item => {
    if (!grouped[item.category]) grouped[item.category] = [];
    grouped[item.category].push(item);
  });

  let text = `🛒 Einkaufsliste ${d0} – ${d2}\n`;
  catOrder.forEach(cat => {
    if (!grouped[cat]?.length) return;
    text += `\n*${cat}*\n`;
    grouped[cat].forEach(item => {
      text += `☐ ${item.name} – ${item.amount}\n`;
    });
  });
  text += `\n_Erstellt mit Katrin & Greg Mahlzeitenplaner_ 🥗`;

  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeRecipeModal();
    closeMealModal();
  }
});

// ── START ─────────────────────────────────────────────────────────────────────
// (auto-login and init handled above; password screen is visible by default)
</script>
